# The rules the harness enforces. Code reads this file; agents never see it, so
# they can't argue with a gate or edit it. Changes here go through review.

# Build rounds (each round is build, then CI, then review) before it escalates.
max_rounds: 3

# After readiness, an agent writes a short spec, committed with the change as
# specs/<ticket>.md. When does a human approve it before anything is built?
#   risky:  when the files it plans to change hit a medium or high rule below
#   always: every ticket
#   never:  it's still written and committed, but nobody approves it first
spec:
  approval: risky

# The deterministic risk floor. The highest matching level wins. Low merges
# automatically; medium and high wait for a human to approve. An LLM risk note
# may raise the level later, but never lower it below this. Two things are
# done in code, not here: the ticket's own spec file doesn't count, and a
# change to a file the spec didn't plan makes it at least medium.
risk:
  medium_lines: 150 # total lines added + deleted
  high_lines: 400
  rules:
    - paths: [CLAUDE.md, "*.md"]
      level: high
      why: changes the rules or docs agents work from
    - paths: [go.mod, go.sum]
      level: high
      why: adds or changes dependencies
    - paths: [main.go]
      level: medium
      why: the CLI flags the deploy smoke test depends on
