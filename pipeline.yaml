# The rules the harness enforces. Code reads this file; agents never see it, so
# they can't argue with a gate or edit it. Changes here go through review.

# Build rounds (each round is build, then CI, then review) before it escalates.
max_rounds: 3

# Where tickets come from besides the New ticket button. Each is a webhook at
# POST /api/sources/<name>, and the name picks the adapter that reads the
# sender's payload (sentry, or webhook for anything that can send
# {"id", "title", "description", "url"}).
#   kind: planned (a person asked for it) or reactive (a system noticed
#     something). Both go through the same gates; reactive is shown on the
#     ticket, and is where tighter rules would go.
#   max_open: at most this many open tickets from the source; more reports are
#     dropped (and the sender gets a 429). A report of a problem that already
#     has an open ticket is added to that ticket instead of opening another.
#   secret_env: the environment variable holding the webhook's signing secret.
#     When it's set, unsigned or wrongly signed reports are refused.
sources:
  sentry:
    kind: reactive
    max_open: 3
    secret_env: SENTRY_WEBHOOK_SECRET
  webhook:
    kind: planned
    max_open: 10
    secret_env: HARNESS_WEBHOOK_SECRET

# The models an agent step can be switched to from the Workflow page, per
# runner. Choosing one rewrites that step file's runner: and model: lines and
# nothing else. Steps read their file on every run, so tickets in flight pick
# it up at their next run. cursor-cli runs read-only steps only (Cursor's ask
# mode), so it isn't offered for build.
models:
  claude-cli:
    - claude-fable-5-1
    - claude-opus-5-5
    - claude-sonnet-5-5
    - claude-haiku-5-5
  cursor-cli:
    - composer-2.5
    - gpt-5.3-codex
    - gpt-5.6-sol-high
    - cursor-grok-4.5-high

# After refinement, an agent writes a short spec, committed with the change as
# specs/<ticket>.md. When does a human approve it before anything is built?
#   risky:  when the files it plans to change hit a medium or high rule below
#   always: every ticket
#   never:  it's still written and committed, but nobody approves it first
spec:
  approval: risky

# Every merge deploys to dev and is smoke tested there. Who ships it on to
# production: manual (a human checks dev and ships each change) or auto (a
# change that passes on dev ships).
production:
  approval: manual

# The deterministic risk floor. The highest matching level wins. Low merges
# automatically; medium and high wait for a human to approve. An LLM risk note
# may raise the level later, but never lower it below this. Two things are
# done in code, not here: the ticket's own spec file doesn't count, and a
# change to a file the spec didn't plan makes it at least medium.
risk:
  medium_lines: 150 # total lines added + deleted
  high_lines: 400
  rules:
    - paths: [CLAUDE.md, "*.md"]
      level: high
      why: changes the rules or docs agents work from
    - paths: [go.mod, go.sum]
      level: high
      why: adds or changes dependencies
    - paths: [main.go]
      level: medium
      why: the CLI flags the deploy smoke test depends on
