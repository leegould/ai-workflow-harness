# Changes to this file loosen or tighten what every PR is held to; treat them
# as high risk (see scripts/guard.sh).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint     # errors.Is/As and %w, not == or %v
    - gocritic
    - gosec         # security
    - misspell
    - nilerr        # returning nil when err != nil
    - noctx         # HTTP requests without a context
    - revive        # style
    - unconvert
    - unparam
    - wrapcheck     # errors from other packages must be wrapped with context
  settings:
    wrapcheck:
      ignore-sig-regexps:
        - \.Get\(ctx # workflow.Future.Get: Temporal errors already carry activity context
        - temporal\.New
    revive:
      rules:
        - name: exported
          disabled: true # stubs don't need doc comments on every method yet
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - aiharness
